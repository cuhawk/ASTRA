[project]
name = "astra"
version = "0.0.1"
description = "BloodHound for JS web apps, delivered as a hosted SaaS."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "kuzu>=0.6.0",
    "lancedb>=0.13.0",
    "playwright>=1.48",
    "pyarrow>=17.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.4",
    "fakeredis[lua]>=2.24",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.32",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["backend", "tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    # Vendored tlxkull tests reference its `modules.*` / `kernel.*` namespaces,
    # which we deliberately do not expose. Skip the whole vendored test trees —
    # re-vendor / port when we wire them into ASTRA proper.
    "--ignore=backend/pillars/sast/tests",
    "--ignore=backend/mcp/tests",
    "--ignore=backend/pillars/memory/tests/test_docs_tools.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
